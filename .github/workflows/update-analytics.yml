name: Update Profile Analytics (self-hosted)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        run: mkdir -p assets/analytics

      - name: Download SVGs (resilient)
        shell: bash
        run: |
          set -e

          USER="therahulr"

          fetch_svg_or_keep_old() {
            local url="$1"
            local out="$2"

            echo "Fetching: $out"
            tmp="${out}.tmp"

            # Try hard to fetch
            for i in 1 2 3 4 5; do
              # Add user-agent to avoid some edge blocks
              if curl -fsSL \
                -H "User-Agent: github-actions" \
                --retry 3 --retry-delay 2 \
                --connect-timeout 20 --max-time 90 \
                "$url" -o "$tmp"; then

                # Validate SVG
                if grep -qi "<svg" "$tmp"; then
                  mv "$tmp" "$out"
                  echo "OK: $out"
                  return 0
                fi
              fi

              echo "Retry $i failed for $out; sleeping..."
              sleep 6
            done

            rm -f "$tmp"

            # If we already have an old file, keep it and continue
            if [ -f "$out" ] && grep -qi "<svg" "$out"; then
              echo "WARN: Upstream failed for $out — keeping last known good SVG."
              return 0
            fi

            # No old file exists => fail (first run needs at least one successful fetch)
            echo "ERROR: Upstream failed and no previous SVG exists for $out"
            return 1
          }

          # Primary sources (can occasionally 503)
          fetch_svg_or_keep_old \
            "https://github-readme-stats.vercel.app/api?username=${USER}&show_icons=true&hide_border=true&bg_color=000000&title_color=ffffff&text_color=cccccc&icon_color=ffffff&cache_seconds=1800" \
            "assets/analytics/github-stats.svg"

          fetch_svg_or_keep_old \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${USER}&layout=compact&hide_border=true&bg_color=000000&title_color=ffffff&text_color=cccccc&cache_seconds=1800" \
            "assets/analytics/top-langs.svg"

          fetch_svg_or_keep_old \
            "https://streak-stats.demolab.com?user=${USER}&hide_border=true&background=000000&ring=ffffff&fire=ffffff&currStreakLabel=ffffff&sideLabels=ffffff&currStreakNum=ffffff&sideNums=cccccc&dates=777777" \
            "assets/analytics/streak.svg"

          fetch_svg_or_keep_old \
            "https://github-readme-activity-graph.vercel.app/graph?username=${USER}&bg_color=000000&color=cccccc&line=ffffff&point=ffffff&area=true&hide_border=true" \
            "assets/analytics/activity-graph.svg"

      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update self-hosted analytics svgs"
          file_pattern: assets/analytics/*.svg
